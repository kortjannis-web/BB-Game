<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yharnam Erzählbaum</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=EB+Garamond:ital@0;1&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="karte.css">
  <link rel="stylesheet" href="werkstatt.css">
</head>
<body data-seite="baum">
  <header id="kopf">
    <div class="marke">
      <h1>Yharnam <span>Erzählbaum</span></h1>
      <p id="statistik">Lädt …</p>
    </div>
    <div class="werkzeuge">
      <label class="suche"><span class="unsichtbar">Suchen</span><input id="suche" type="search" placeholder="Suchen: Gilbert, Spieluhr, Tod …" autocomplete="off"></label>
      <span id="treffer" aria-live="polite"></span>
      <label class="schalter"><input id="bausteine" type="checkbox"> <span class="lang">Tod und </span>Bausteine</label>
      <button id="z-start" type="button" title="Zum Start">Start</button>
      <button id="z-fit" type="button" title="Alles zeigen">Alles</button>
      <button id="z-minus" type="button" aria-label="Verkleinern">−</button>
      <button id="z-plus" type="button" aria-label="Vergrößern">+</button>
      <button type="button" data-werkstatt-modus aria-pressed="false" title="Passagen, Entscheidungen und Verbindungen als Vorschlag ändern">✎ Bearbeiten</button>
      <button id="neu-passage" type="button" hidden title="Neue Passage anlegen (von der gewählten aus)">+ Passage</button>
      <a id="link-spiel" class="spielen" href="index.html">Spielen</a>
    </div>
    <ul id="legende" aria-label="Legende"></ul>
  </header>

  <main id="leinwand" aria-label="Erzählbaum">
    <div id="welt">
      <svg id="linien" aria-hidden="true">
        <defs>
          <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"></path></marker>
        </defs>
        <g id="kanten"></g>
      </svg>
      <div id="knoten"></div>
    </div>
    <canvas id="minikarte" width="200" height="200" aria-label="Übersicht"></canvas>
  </main>

  <aside id="tafel" hidden>
    <button id="tafel-zu" type="button" aria-label="Schließen">×</button>
    <div id="tafel-inhalt"></div>
  </aside>

  <script src="werkstatt.js"></script>
  <script src="karte.js"></script>
</body>
</html>
