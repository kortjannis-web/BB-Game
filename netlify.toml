# Rückfall, nicht mehr in Gebrauch: Seit 2026-11-05 läuft das Spiel über GitHub Pages (.github/workflows/pages.yml).
# Netlify hatte die Credits aufgebraucht (Production-Deploys pausiert). Die Site bei Netlify am besten vom Repository trennen.
# Einrichtung (einmalig): docs/hosting.md
[build]
  command = "npm run bauen"
  publish = "web"

[build.environment]
  NODE_VERSION = "20"

# Der Zweig mit den Vorschlägen enthält nur Vorschlagsdateien; dafür nichts bauen.
[context.vorschlaege]
  command = "echo 'Nur Vorschläge, kein Bau.'"
