# Hosting über GitHub Pages: Jeder Push auf "main" baut das Spiel und stellt web/ online.
# Läuft nur, wenn GitHub Pages für dieses Repository möglich ist: öffentliches Repository,
# oder privates Repository mit bezahltem Plan und der Repository-Variable PAGES = an.
# Einmalig: Settings → Pages → Source: "GitHub Actions". Mehr in docs/hosting.md.
name: Spiel veröffentlichen (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    if: ${{ !github.event.repository.private || vars.PAGES == 'an' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run bauen
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
